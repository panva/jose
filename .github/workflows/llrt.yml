name: LLRT

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: LLRT release tag or latest
        required: true
        default: latest
        type: string

jobs:
  tap:
    runs-on: ubuntu-latest
    env:
      LLRT_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'npm'
      - run: npm clean-install
      - name: Download LLRT
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$LLRT_VERSION" == latest ]]; then
            gh release download --repo awslabs/llrt \
              --pattern llrt-linux-x64.zip \
              --dir "$RUNNER_TEMP"
          else
            gh release download "$LLRT_VERSION" --repo awslabs/llrt \
              --pattern llrt-linux-x64.zip \
              --dir "$RUNNER_TEMP"
          fi
          mkdir "$RUNNER_TEMP/llrt"
          unzip -q "$RUNNER_TEMP/llrt-linux-x64.zip" -d "$RUNNER_TEMP/llrt"
          chmod +x "$RUNNER_TEMP/llrt/llrt"
      - name: Test LLRT
        run: npm run tap:llrt
        env:
          LLRT_BIN: ${{ runner.temp }}/llrt/llrt
