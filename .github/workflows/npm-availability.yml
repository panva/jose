name: npm availability

permissions: {}

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to monitor
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to monitor
        required: true
        type: string

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
      - name: Wait for npm availability
        run: node tools/wait-for-npm.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
