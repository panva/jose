name: npm availability

permissions: {}

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to monitor
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to monitor
        required: true
        type: string

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - name: Wait for npm availability
        run: node tools/wait-for-npm.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
